apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verdantnest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sanyambedi/verdantnest.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
